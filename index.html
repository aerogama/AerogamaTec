<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AerogamaTec - AI Companions & Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050508;
            --panel-bg: rgba(12, 12, 20, 0.92);
            --neon-pink: #ff2a6d;
            --neon-cyan: #05d9e8;
            --neon-purple: #b967ff;
            --text-main: #f0f0f5;
            --text-muted: #8b8b9e;
            --border-glow: rgba(255, 42, 109, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(185, 103, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(5, 217, 232, 0.06) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HEADER / BANNER AMBIENTAL AMPLIADO */
        .header-banner {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(5, 217, 232, 0.25);
            margin-bottom: 25px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .banner-blur-bg {
            position: absolute;
            inset: -20px;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            object-fit: cover;
            filter: blur(25px) brightness(0.4) contrast(1.2);
            z-index: 1;
        }

        .banner-main-art {
            position: relative;
            z-index: 2;
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            transform: scale(1.1);
            filter: drop-shadow(0 0 20px rgba(5, 217, 232, 0.5));
        }

        .header-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: linear-gradient(90deg, rgba(5,5,8,0.85) 0%, rgba(5,5,8,0.1) 35%, rgba(5,5,8,0.1) 65%, rgba(5,5,8,0.85) 100%);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 20px 25px;
            pointer-events: none;
        }

        .header-overlay * {
            pointer-events: auto;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(5, 5, 8, 0.75);
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 42, 109, 0.4);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .brand-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--neon-pink);
            object-fit: cover;
            box-shadow: 0 0 10px var(--neon-pink);
            background: #000;
        }

        .brand-text h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink);
            line-height: 1.1;
        }

        .brand-text p {
            color: var(--neon-cyan);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .fb-btn {
            background: rgba(24, 119, 242, 0.3);
            border: 1px solid #1877f2;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: 0 0 12px rgba(24, 119, 242, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
        }

        .fb-btn:hover {
            background: #1877f2;
            box-shadow: 0 0 20px rgba(24, 119, 242, 0.8);
            transform: translateY(-2px);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            border-left: 4px solid var(--neon-pink);
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* MODEL CARD */
        .model-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        .model-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .model-grid {
                grid-template-columns: 1fr;
            }
            .header-banner {
                height: 260px;
            }
            .banner-main-art {
                transform: scale(1);
            }
            .header-overlay {
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-start;
                padding: 15px;
                gap: 10px;
            }
        }

        .model-profile-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .model-main-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.3);
        }

        .model-details-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .model-header-info h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .model-tagline {
            color: var(--neon-cyan);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .model-bio {
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        /* AUDIO TEASER */
        .audio-player-box {
            background: rgba(5, 217, 232, 0.04);
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .audio-wave-icon {
            font-size: 1.3rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; text-shadow: 0 0 8px var(--neon-cyan); }
            100% { transform: scale(1); opacity: 0.7; }
        }

        .audio-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .audio-sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: #fff;
            margin-bottom: 4px;
        }

        audio {
            width: 100%;
            height: 32px;
            filter: invert(1) hue-rotate(180deg);
        }

        /* PLATFORM BUTTONS */
        .platform-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }

        .plat-btn {
            padding: 10
